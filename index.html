<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-poin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to e-poin</h1>
        <p>Sistem catat Poin siswa</p>
    </header>

    <section>
     <form action="tambah_poin.php" method="POST">

    <label for="nama">Nama Siswa:</label>
    <input type="text" id="nama" name="nama" required>

    <br><br>

    <label for="kelas">Kelas:</label>
    <input type="text" id="kelas" name="kelas" required>
    <br><br>
    <lebel for="jurusan" >Jurusan:</lebel>
    <select name="jurusan" id="jurusan">
        <option value="RPL">RPL</option>
        <option value="LP">LP</option>
        <option value="MP">MP</option>
        <option value="AK">AK</option>
        <option value="BD">BD</option>
    </select>
     <br><br>
    <lebel for="pelanggaran" >Pelanggaran:</lebel>
    <textarea name="pelanggaran" id="pelanggaran" rows="4" cols="50"></textarea>
    <br><br>
     <br><br>

    <label for="poin">Jumlah Poin:</label>
    <input type="number" id="poin" name="poin" required>
    <br><br>

    <input type="submit" value="Tambahkan Poin">

</form>
    </section>

    <footer>
        <p>&copy; 2024 e-poin. All rights reserved.</p>
    </footer>
</body>
</html>
